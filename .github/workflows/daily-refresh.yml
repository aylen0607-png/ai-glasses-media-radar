name: Refresh AI glasses media

on:
  schedule:
    # 08:30 Asia/Shanghai (UTC+8). GitHub may delay scheduled runs during heavy load.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh public official media sources
        run: node server.js --refresh
      - name: Commit refreshed media index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "chore: refresh media radar"
          git push
